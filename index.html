<title>鲜惠超市 — Fresh Mart</title>

<style>
  :root{--green:#2d6a4f;--green-mid:#40916c;--green-pale:#d8f3dc;--orange:#e76f51;--dark:#1b1b1b;--gray:#6b7280;--gray-light:#f3f4f6;--white:#fff;--shadow:0 4px 24px rgba(45,106,79,.10);--shadow-hover:0 8px 32px rgba(45,106,79,.18);--radius:16px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans SC',sans-serif;background:#f7f9f4;color:var(--dark);}
  .lang-toggle{display:flex;gap:2px;background:var(--gray-light);border-radius:50px;padding:3px;}
  .lang-btn{border:none;background:transparent;border-radius:50px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--gray);transition:all .2s;}
  .lang-btn.active{background:var(--green);color:#fff;}
  nav{background:var(--white);border-bottom:2px solid var(--green-pale);position:sticky;top:0;z-index:100;padding:0 5vw;}
  .nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;height:64px;}
  .logo{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;color:var(--green);text-decoration:none;white-space:nowrap;}
  .logo span{color:var(--orange);}
  .search-bar{flex:1;display:flex;align-items:center;background:var(--gray-light);border-radius:50px;padding:0 16px;gap:8px;}
  .search-bar input{flex:1;border:none;background:transparent;font-size:14px;font-family:inherit;outline:none;color:var(--dark);padding:10px 0;}
  .search-bar button{background:var(--green);color:#fff;border:none;border-radius:50px;padding:6px 18px;font-size:13px;cursor:pointer;font-family:inherit;}
  .cart-btn{background:var(--green-pale);border:none;border-radius:50px;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--green);font-weight:500;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;}
  .cart-btn:hover{background:var(--green);color:#fff;}
  .cart-count{background:var(--orange);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-mid) 100%);color:#fff;padding:48px 5vw 56px;}
  .hero-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:32px;}
  .hero h1{font-family:'Noto Serif SC',serif;font-size:clamp(26px,4vw,44px);line-height:1.3;margin-bottom:12px;}
  .hero p{font-size:16px;opacity:.85;margin-bottom:24px;}
  .hero-badges{display:flex;gap:10px;flex-wrap:wrap;}
  .badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 14px;font-size:13px;}
  .hero-emoji{font-size:80px;line-height:1;}
  .banner-strip{background:var(--green-pale);border-top:2px solid rgba(82,183,136,.2);border-bottom:2px solid rgba(82,183,136,.2);padding:12px 5vw;display:flex;gap:32px;justify-content:center;flex-wrap:wrap;}
  .banner-item{font-size:14px;color:var(--green);font-weight:500;}
  .cats{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:32px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-pill{flex-shrink:0;background:var(--white);border:2px solid transparent;border-radius:50px;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--gray);transition:all .2s;white-space:nowrap;}
  .cat-pill:hover,.cat-pill.active{border-color:var(--green);color:var(--green);background:var(--green-pale);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
  .product-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:all .25s;}
  .product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);}
  .product-img{background:var(--gray-light);height:160px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;}
  .tag-sale{position:absolute;top:10px;left:10px;background:var(--orange);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;}
  .tag-new{position:absolute;top:10px;left:10px;background:var(--green);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;}
  .product-info{padding:14px;}
  .product-name{font-size:14px;font-weight:500;margin-bottom:4px;line-height:1.4;}
  .product-unit{font-size:12px;color:var(--gray);margin-bottom:10px;}
  .product-bottom{display:flex;align-items:center;justify-content:space-between;}
  .price{font-size:18px;font-weight:700;color:var(--green);}
  .price-orig{font-size:12px;color:var(--gray);text-decoration:line-through;margin-left:4px;}
  .add-btn{background:var(--green);color:#fff;border:none;border-radius:50px;width:32px;height:32px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1;}
  .add-btn:hover{background:var(--orange);transform:scale(1.1);}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{background:var(--gray-light);border:none;border-radius:50%;width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .qty-ctrl button:hover{background:var(--green-pale);}
  .qty-ctrl span{font-size:14px;font-weight:700;min-width:16px;text-align:center;}
  .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
  .cart-overlay.open{opacity:1;pointer-events:all;}
  .cart-sidebar{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--white);box-shadow:-8px 0 40px rgba(0,0,0,.15);z-index:201;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;}
  .cart-sidebar.open{transform:translateX(0);}
  .cart-header{padding:20px 24px;border-bottom:2px solid var(--green-pale);display:flex;align-items:center;justify-content:space-between;}
  .cart-header h2{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;}
  .close-btn{background:var(--gray-light);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;}
  .cart-items{flex:1;overflow-y:auto;padding:16px 24px;}
  .cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--gray-light);}
  .cart-item-emoji{font-size:36px;}
  .cart-item-info{flex:1;}
  .cart-item-name{font-size:14px;font-weight:500;margin-bottom:2px;}
  .cart-item-price{font-size:13px;color:var(--green);font-weight:700;}
  .cart-empty{text-align:center;padding:48px 24px;color:var(--gray);}
  .cart-empty .empty-emoji{font-size:56px;margin-bottom:12px;}
  .cart-footer{padding:20px 24px;border-top:2px solid var(--green-pale);}
  .cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cart-total-price{font-size:24px;font-weight:700;color:var(--green);}
  .checkout-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:50px;padding:16px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;}
  .checkout-btn:hover{background:var(--orange);}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--white);border-radius:20px;width:min(480px,92vw);padding:28px;max-height:90vh;overflow-y:auto;}
  .modal h3{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;margin-bottom:20px;}
  .frow{margin-bottom:14px;}
  .frow label{display:block;font-size:13px;color:var(--gray);margin-bottom:5px;}
  .frow input,.frow select{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;}
  .frow input:focus,.frow select:focus{border-color:var(--green);}
  .modal-summary{background:var(--green-pale);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14px;color:var(--green);}
  .modal-footer{display:flex;gap:10px;margin-top:20px;}
  .modal-footer button{flex:1;border:none;border-radius:50px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  .btn-cancel{background:var(--gray-light);color:var(--gray);}
  .btn-confirm{background:var(--green);color:#fff;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:#fff;border-radius:50px;padding:12px 24px;font-size:14px;font-weight:500;z-index:400;transition:transform .3s ease;white-space:nowrap;pointer-events:none;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .section-title{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;}
  @media(max-width:600px){.hero-emoji{display:none;}.grid{grid-template-columns:repeat(2,1fr);gap:10px;}.product-img{height:120px;font-size:44px;}}
</style>
</head>

  en:{sp:'Search products, e.g. apple, milk…',sb:'Search',cl:'Cart',ht:'Farm Fresh<br>Daily Deals',hs:'Direct from local farms — picked and delivered same day',b1:'🚚 2-hr Delivery',b2:'🌿 Farm Direct',b3:'💰 Daily Deals',bn1:'🚚 Free shipping over ¥99',bn2:'🎁 New user ¥20 off',bn3:"⏰ Today's deals end 23:59",bn4:'🌟 Earn reward points',cats:['🏪 All','🥬 Fresh & Veg','🥩 Meat & Eggs','🥛 Dairy','🍪 Snacks','🌾 Grains & Oils','🧴 Essentials'],keys:['ALL','生鲜','肉禽','乳品','零食','粮油','日用'],titles:{ALL:'🛒 All Products',生鲜:'🥬 Fresh & Veg',肉禽:'🥩 Meat & Eggs',乳品:'🥛 Dairy',零食:'🍪 Snacks',粮油:'🌾 Grains & Oils',日用:'🧴 Essentials'},cnt:n=>`${n} products`,noRes:'😢 No products found',tsale:'SALE',tnew:'NEW',ctitle:'🛒 My Cart',tlabel:'Total',cobtn:'Checkout',eCart:'Your cart is empty',eSub:'Start adding some items!',added:p=>`Added ${p.emoji} ${p.name_en}`,empty:'Your cart is empty',ckTitle:'📋 Delivery Info',lName:'Recipient Name',lPhone:'Phone',lAddr:'Address',lTime:'Delivery Time',cancel:'Cancel',confirm:'Place Order',ok:a=>`🎉 Order placed! Total ¥${a}`,fail:'Failed, please retry',fill:'Please fill in all fields',sum:(n,t)=>`${n} items · ¥${t}`,},
};

let lang='zh',cart={},cat='ALL',q='',products=[];

function setLang(l){lang=l;document.getElementById('btnZH').classList.toggle('active',l==='zh');document.getElementById('btnEN').classList.toggle('active',l==='en');applyLang();}
function applyLang(){
  const t=T[lang];
  document.getElementById('searchInput').placeholder=t.sp;
  document.getElementById('searchBtn').textContent=t.sb;
  document.getElementById('navCartLabel').textContent=t.cl;
  document.getElementById('heroTitle').innerHTML=t.ht;
  document.getElementById('heroSub').textContent=t.hs;
  ['b1','b2','b3','bn1','bn2','bn3','bn4'].forEach(id=>document.getElementById(id).textContent=t[id]);
  document.getElementById('cartTitle').textContent=t.ctitle;
  document.getElementById('totalLabel').textContent=t.tlabel;
  document.getElementById('checkoutBtn').textContent=t.cobtn;
  document.getElementById('checkoutTitle').textContent=t.ckTitle;
  document.getElementById('lName').textContent=t.lName;
  document.getElementById('lPhone').textContent=t.lPhone;
  document.getElementById('lAddr').textContent=t.lAddr;
  document.getElementById('lTime').textContent=t.lTime;
  document.getElementById('btnCancel').textContent=t.cancel;
  document.getElementById('btnConfirm').textContent=t.confirm;
  renderCats();renderGrid();renderCart();
}
function renderCats(){
  const t=T[lang];
  document.getElementById('catBar').innerHTML=t.cats.map((l,i)=>`<button class="cat-pill${cat===t.keys[i]?' active':''}" onclick="setCat('${t.keys[i]}',this)">${l}</button>`).join('');
  document.getElementById('sectionTitle').textContent=t.titles[cat]||'';
}
function setCat(c,el){cat=c;document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById('sectionTitle').textContent=T[lang].titles[c]||c;renderGrid();}
function filterProducts(){q=document.getElementById('searchInput').value.trim();renderGrid();}
function filtered(){return products.filter(p=>{if(!p.active)return false;const mc=cat==='ALL'||p.category===cat;const n=lang==='zh'?p.name_zh:p.name_en;const ms=!q||n.toLowerCase().includes(q.toLowerCase())||p.name_zh.includes(q);return mc&&ms;});}
function renderGrid(){
  const t=T[lang];const list=filtered();const g=document.getElementById('productGrid');
  document.getElementById('productCount').textContent=t.cnt(list.length);
  if(!list.length){g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--gray)">${t.noRes}</div>`;return;}
  g.innerHTML=list.map(p=>{
    const qty=cart[p.id]||0;
    const name=lang==='zh'?p.name_zh:p.name_en;
    const unit=lang==='zh'?p.unit_zh:p.unit_en;
    const tag=p.tag==='sale'?`<span class="tag-sale">${t.tsale}</span>`:p.tag==='new'?`<span class="tag-new">${t.tnew}</span>`:'';
    const orig=p.original_price?`<span class="price-orig">¥${p.original_price}</span>`:'';
    const ctrl=qty>0?`<div class="qty-ctrl"><button onclick="chg(${p.id},-1,event)">−</button><span>${qty}</span><button onclick="chg(${p.id},1,event)">+</button></div>`:`<button class="add-btn" onclick="add(${p.id},event)">+</button>`;
    return `<div class="product-card"><div class="product-img">${p.emoji}${tag}</div><div class="product-info"><div class="product-name">${name}</div><div class="product-unit">${unit}</div><div class="product-bottom"><div><span class="price">¥${p.price}</span>${orig}</div><div id="c${p.id}">${ctrl}</div></div></div></div>`;
  }).join('');
}
function add(id,e){e.stopPropagation();cart[id]=(cart[id]||0)+1;updateUI();rCtrl(id);const p=products.find(x=>x.id===id);toast(T[lang].added(p));}
function chg(id,d,e){e.stopPropagation();cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];updateUI();rCtrl(id);}
function rCtrl(id){const qty=cart[id]||0;const el=document.getElementById('c'+id);if(!el)return;el.innerHTML=qty>0?`<div class="qty-ctrl"><button onclick="chg(${id},-1,event)">−</button><span>${qty}</span><button onclick="chg(${id},1,event)">+</button></div>`:`<button class="add-btn" onclick="add(${id},event)">+</button>`;}
function total(){return Object.keys(cart).reduce((s,id)=>{const p=products.find(x=>x.id==id);return s+(p?p.price*cart[id]:0);},0);}
function count(){return Object.values(cart).reduce((s,v)=>s+v,0);}
function updateUI(){document.getElementById('cartCount').textContent=count();document.getElementById('cartTotal').textContent='¥'+total().toFixed(2);renderCart();}
function renderCart(){
  const t=T[lang];const c=document.getElementById('cartItems');const keys=Object.keys(cart);
  if(!keys.length){c.innerHTML=`<div class="cart-empty"><div class="empty-emoji">🛒</div><div>${t.eCart}</div><div style="font-size:12px;margin-top:4px">${t.eSub}</div></div>`;return;}
  c.innerHTML=keys.map(id=>{const p=products.find(x=>x.id==id);if(!p)return'';const qty=cart[id];const n=lang==='zh'?p.name_zh:p.name_en;return`<div class="cart-item"><div class="cart-item-emoji">${p.emoji}</div><div class="cart-item-info"><div class="cart-item-name">${n}</div><div class="cart-item-price">¥${p.price} × ${qty} = ¥${(p.price*qty).toFixed(2)}</div></div><div class="qty-ctrl"><button onclick="chg(${id},-1,event)">−</button><span>${qty}</span><button onclick="chg(${id},1,event)">+</button></div></div>`;}).join('');
}
function openCart(){document.getElementById('cartOverlay').classList.add('open');document.getElementById('cartSidebar').classList.add('open');}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');document.getElementById('cartSidebar').classList.remove('open');}
function openCheckout(){const t=T[lang];if(!count()){toast(t.empty);return;}document.getElementById('orderSummary').textContent=t.sum(count(),total().toFixed(2));document.getElementById('checkoutModal').classList.add('open');closeCart();}
function closeCheckout(){document.getElementById('checkoutModal').classList.remove('open');}
async function submitOrder(){
  const t=T[lang];
  const name=document.getElementById('rName').value.trim();
  const phone=document.getElementById('rPhone').value.trim();
  const addr=document.getElementById('rAddr').value.trim();
  if(!name||!phone||!addr){toast(t.fill);return;}
  const items=Object.keys(cart).map(id=>{const p=products.find(x=>x.id==id);return{id:+id,name_zh:p.name_zh,name_en:p.name_en,emoji:p.emoji,price:p.price,qty:cart[id]};});
  const tot=total();
  try{
    await POST('orders',{items,total:tot,address:`${name} | ${phone} | ${addr} | ${document.getElementById('dTime').value}`,status:'待处理'});
    for(const item of items){const p=products.find(x=>x.id==item.id);if(p)await PATCH('products','id=eq.'+item.id,{stock:Math.max(0,p.stock-item.qty)});}
    cart={};updateUI();closeCheckout();toast(t.ok(tot.toFixed(2)));
    await load();
  }catch(e){toast(t.fail);}
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
async function load(){
  try{const d=await GET('products','select=*&order=id');if(Array.isArray(d)&&d.length)products=d;}catch(e){}
  renderGrid();
}
async function init(){
  try{
    const check=await GET('products','select=id&limit=1');
    if(!Array.isArray(check)||!check.length)await POST('products',SEEDS);
  }catch(e){}
  await load();applyLang();
}
init();
</script>
</body>
