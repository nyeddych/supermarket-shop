<style>
  :root{--green:#2d6a4f;--green-light:#52b788;--green-pale:#d8f3dc;--orange:#e76f51;--orange-pale:#ffddd2;--dark:#1b1b1b;--gray:#6b7280;--gray-light:#f3f4f6;--white:#fff;--sidebar-w:220px;--shadow:0 2px 12px rgba(0,0,0,.08);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans SC',sans-serif;background:#f7f9f4;color:var(--dark);display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);background:var(--green);color:#fff;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:10;}
  .sidebar-logo{padding:20px 20px 16px;font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15);}
  .sidebar-logo span{color:#a7f3d0;}
  .sidebar-nav{padding:12px 0;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:14px;font-weight:500;color:rgba(255,255,255,.75);transition:all .2s;border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:#a7f3d0;}
  .nav-icon{font-size:16px;}
  .lang-toggle-side{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.15);border-radius:50px;padding:3px;margin:0 16px 12px;}
  .lang-btn-s{flex:1;border:none;background:transparent;border-radius:50px;padding:5px 0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:rgba(255,255,255,.7);transition:all .2s;text-align:center;}
  .lang-btn-s.active{background:rgba(255,255,255,.9);color:var(--green);}
  .sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:rgba(255,255,255,.5);}
  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;}
  .topbar{background:var(--white);border-bottom:1px solid #e5e7eb;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:var(--shadow);}
  .topbar-title{font-size:17px;font-weight:700;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .admin-badge{background:var(--green-pale);color:var(--green);border-radius:50px;padding:5px 12px;font-size:13px;font-weight:500;}
  .content{padding:24px 28px;flex:1;}
  .page{display:none;} .page.active{display:block;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--white);border-radius:12px;padding:18px;box-shadow:var(--shadow);}
  .stat-label{font-size:13px;color:var(--gray);margin-bottom:6px;}
  .stat-value{font-size:26px;font-weight:700;margin-bottom:4px;}
  .stat-trend{font-size:12px;color:var(--green);}
  .stat-trend.down{color:var(--orange);}
  .card{background:var(--white);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;}
  .card-header{padding:14px 18px;border-bottom:1px solid var(--gray-light);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:15px;font-weight:700;}
  .btn{border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:all .2s;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:#40916c;}
  .btn-danger{background:#fee2e2;color:#dc2626;}
  .btn-danger:hover{background:#dc2626;color:#fff;}
  .btn-sm{padding:4px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;}
  th{background:var(--gray-light);padding:11px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--gray);}
  td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--gray-light);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fafff8;}
  .status-pill{border-radius:50px;padding:3px 10px;font-size:12px;font-weight:500;}
  .status-pending{background:#fef3c7;color:#92400e;}
  .status-shipping{background:#dbeafe;color:#1e40af;}
  .status-done{background:var(--green-pale);color:var(--green);}
  .status-normal{background:var(--gray-light);color:var(--gray);}
  .low-stock{color:var(--orange);font-weight:600;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);border-radius:14px;width:min(460px,90vw);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:18px;}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12px;font-weight:500;color:var(--gray);margin-bottom:5px;}
  .form-row input,.form-row select{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
  .form-row input:focus,.form-row select:focus{border-color:var(--green);}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;z-index:200;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;}
  .toast.show{transform:translateY(0);opacity:1;}
  @media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr);}.sidebar{transform:translateX(-100%);}.main{margin-left:0;}}
</style>
</head>

        </div>
        <table><thead><tr id="orderTHead"></tr></thead><tbody id="orderTable"></tbody></table>
      </div>
    </div>

    <!-- INVENTORY -->
    <div class="page" id="page-inventory">

        <div class="card-header"><div class="card-title" id="lowStockTitle"></div></div>

    </div>

  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="form-row"><label id="lName"></label><input type="text" id="pName"></div>

    <div class="form-row-2">

      <div class="form-row"><label id="lEmoji"></label><input type="text" id="pEmoji" placeholder="🥦"></div>
    </div>
    <div class="form-row-2">
      <div class="form-row"><label id="lPrice"></label><input type="number" id="pPrice" step="0.1"></div>
      <div class="form-row"><label id="lOrig"></label><input type="number" id="pOrig" step="0.1"></div>
    </div>
    <div class="form-row-2">

  </div>
</div>

  {id:'#20240315006',summaryZh:'🍊砂糖橙×3 🍵绿茶×2',summaryEn:'🍊Orange×3 🍵Tea×2',amount:62.7,addr:'北京市昌平区回龙观大街',addrEn:'Huilongguan Ave, Changping, Beijing',status:'已完成',time:'08:20'},
  {id:'#20240315007',summaryZh:'🧴洗洁精×2 🧻纸巾×3',summaryEn:'🧴Dish Soap×2 🧻Roll×3',amount:55.5,addr:'北京市顺义区后沙峪镇',addrEn:'Houshayu Town, Shunyi, Beijing',status:'待处理',time:'10:40'},
];

const statusMap={
  zh:{待处理:'待处理',配送中:'配送中',已完成:'已完成'},
  en:{待处理:'Pending',配送中:'Shipping',已完成:'Completed'}
};
function statusClass(s){return{待处理:'status-pending',配送中:'status-shipping',已完成:'status-done'}[s]||'status-normal';}
function statusLabel(s){return statusMap[lang][s]||s;}

function setLang(l){
  lang=l;
  document.getElementById('sBtnZH').classList.toggle('active',l==='zh');
  document.getElementById('sBtnEN').classList.toggle('active',l==='en');
  applyLang();
}

function applyLang(){
  const t=T[lang];
  document.getElementById('sideAdminLabel').textContent=t.sideAdmin;
  ['dashboard','products','orders','inventory'].forEach((k,i)=>{
    document.querySelector(`#nav-${k} .nav-label`).textContent=t.navLabels[i];
  });
  document.getElementById('sideFooter').textContent=t.sideFooter;
  document.getElementById('adminBadge').textContent=t.adminBadge;
  document.getElementById('frontBtn').textContent=t.frontBtn;
  document.getElementById('pageTitle').textContent=t.pageTitles[currentPage];
  document.getElementById('stat1Label').textContent=t.stat1;
  document.getElementById('stat2Label').textContent=t.stat2;
  document.getElementById('stat3Label').textContent=t.stat3;
  document.getElementById('stat3Sub').textContent=t.stat3Sub;
  document.getElementById('stat4Label').textContent=t.stat4;
  document.getElementById('stat4Sub').textContent=t.stat4Sub;
  document.getElementById('recentOrdersTitle').textContent=t.recentOrders;
  document.getElementById('hotSellTitle').textContent=t.hotSell;
  document.getElementById('prodListTitle').textContent=t.prodList;
  document.getElementById('addProdBtn').textContent=t.addProd;
  document.getElementById('allOrdersTitle').textContent=t.allOrders;
  document.getElementById('lowStockTitle').textContent=t.lowStock;
  document.getElementById('okStockTitle').textContent=t.okStock;
  // order filter options
  const sel=document.getElementById('orderFilter');
  const curVal=sel.value;
  sel.innerHTML=t.orderStatuses.map((s,i)=>`<option value="${i===0?'ALL':['ALL','待处理','配送中','已完成'][i]}">${s}</option>`).join('');
  // refresh current page tables
  renderDashOrders(); renderProducts(); renderOrders(sel.value||'ALL'); renderInventory();
}

function goPage(name,el){
  currentPage=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  document.getElementById('pageTitle').textContent=T[lang].pageTitles[name];
  if(name==='products')renderProducts();
  if(name==='orders')renderOrders('ALL');
  if(name==='inventory')renderInventory();
  if(name==='dashboard')renderDashOrders();
}

function renderDashOrders(){
  const t=T[lang];
  document.getElementById('dashTHead').innerHTML=t.dashTH.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('hotTHead').innerHTML=t.hotTH.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('dashOrderTable').innerHTML=orders.slice(0,5).map(o=>`
    <tr>
      <td style="font-weight:500;font-size:11px;color:var(--gray)">${o.id}</td>
      <td>${lang==='zh'?o.summaryZh:o.summaryEn}</td>
      <td style="color:var(--green);font-weight:700">¥${o.amount}</td>
      <td><span class="status-pill ${statusClass(o.status)}">${statusLabel(o.status)}</span></td>
      <td style="color:var(--gray);font-size:12px">${o.time}</td>
      <td>${o.status==='待处理'?`<button class="btn btn-sm btn-primary" onclick="updateOrderStatus('${o.id}','配送中')">${t.orderActions.pending}</button>`:''}</td>
    </tr>`).join('');
  document.getElementById('hotTable').innerHTML=[
    {e:'🥦',zh:'有机西兰花',en:'Organic Broccoli',cat_zh:'生鲜',cat_en:'Fresh',sold:42,stock:86},
    {e:'🍎',zh:'新疆苹果',en:'Xinjiang Apple',cat_zh:'生鲜',cat_en:'Fresh',sold:38,stock:120},
    {e:'🥚',zh:'散养土鸡蛋',en:'Free-range Eggs',cat_zh:'肉禽',cat_en:'Meat',sold:31,stock:52},
    {e:'🥛',zh:'纯牛奶',en:'Pure Milk',cat_zh:'乳品',cat_en:'Dairy',sold:28,stock:74},
    {e:'🍟',zh:'薯片大礼包',en:'Chips Party Pack',cat_zh:'零食',cat_en:'Snacks',sold:19,stock:8,low:true},
  ].map(r=>`<tr><td>${r.e} ${lang==='zh'?r.zh:r.en}</td><td>${lang==='zh'?r.cat_zh:r.cat_en}</td><td>${r.sold}</td><td class="${r.low?'low-stock':''}">${r.stock}${r.low?' ⚠':''}</td></tr>`).join('');
}

function renderProducts(){
  const t=T[lang];
  document.getElementById('prodTHead').innerHTML=t.prodTH.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('productTable').innerHTML=products.map(p=>`
    <tr>
      <td>${p.emoji} ${lang==='zh'?p.nameZh:p.nameEn}<br><span style="font-size:11px;color:var(--gray)">${lang==='zh'?p.unitZh:p.unitEn}</span></td>
      <td>${p.cat}</td>
      <td>¥${p.price}${p.orig?`<span style="font-size:11px;color:var(--gray);text-decoration:line-through;margin-left:4px">¥${p.orig}</span>`:''}</td>
      <td class="${p.stock<20?'low-stock':''}">${p.stock}${p.stock<20?' ⚠':''}</td>
      <td><span class="status-pill ${p.active?'status-done':'status-normal'}">${p.active?t.onShelf:t.offShelf}</span></td>
      <td style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn btn-sm" style="background:var(--gray-light)" onclick="editProduct(${p.id})">${t.editBtn}</button>
        <button class="btn btn-sm btn-danger" onclick="toggleProduct(${p.id})">${t.shelfBtn[p.active]}</button>
      </td>
    </tr>`).join('');
}

function renderOrders(filter){
  const t=T[lang];
  document.getElementById('orderTHead').innerHTML=t.orderTH.map(h=>`<th>${h}</th>`).join('');
  const list=filter==='ALL'?orders:orders.filter(o=>o.status===filter);
  document.getElementById('orderTable').innerHTML=list.map(o=>`
    <tr>
      <td style="font-weight:500;font-size:11px;color:var(--gray)">${o.id}</td>
      <td>${lang==='zh'?o.summaryZh:o.summaryEn}</td>
      <td style="color:var(--green);font-weight:700">¥${o.amount}</td>
      <td style="font-size:12px">${lang==='zh'?o.addr:o.addrEn}</td>
      <td><span class="status-pill ${statusClass(o.status)}">${statusLabel(o.status)}</span></td>
      <td>
        ${o.status==='待处理'?`<button class="btn btn-sm btn-primary" onclick="updateOrderStatus('${o.id}','配送中')">${t.orderActions.pending}</button>`:''}
        ${o.status==='配送中'?`<button class="btn btn-sm btn-primary" onclick="updateOrderStatus('${o.id}','已完成')">${t.orderActions.shipping}</button>`:''}
        ${o.status==='已完成'?`<span style="color:var(--gray);font-size:12px">${t.orderActions.done}</span>`:''}
      </td>
    </tr>`).join('');
}

function filterOrders(val){renderOrders(val);}

function updateOrderStatus(id,newStatus){
  const o=orders.find(x=>x.id===id);
  if(o){o.status=newStatus;renderOrders(document.getElementById('orderFilter').value||'ALL');renderDashOrders();showToast(T[lang].orderUpdated(id,statusLabel(newStatus)));}
}

function renderInventory(){
  const t=T[lang];
  document.getElementById('invWarnHead').innerHTML=t.invWarnTH.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('invOkHead').innerHTML=t.invOkTH.map(h=>`<th>${h}</th>`).join('');
  const low=products.filter(p=>p.stock<20);
  const ok=products.filter(p=>p.stock>=20);
  document.getElementById('inventoryTable').innerHTML=low.map(p=>`
    <tr><td>${p.emoji} ${lang==='zh'?p.nameZh:p.nameEn}</td><td>${p.cat}</td>
    <td class="low-stock">${p.stock} ⚠</td><td>20</td>
    <td style="color:var(--green);font-weight:500">${t.invSuggest(Math.max(50-p.stock,20))}</td></tr>`).join('')
    ||`<tr><td colspan="5" style="text-align:center;color:var(--gray);padding:20px">${t.noWarn}</td></tr>`;
  document.getElementById('inventoryOkTable').innerHTML=ok.map(p=>`
    <tr><td>${p.emoji} ${lang==='zh'?p.nameZh:p.nameEn}</td><td>${p.cat}</td><td>${p.stock}</td>
    <td><span class="status-pill status-done">${t.okLabel}</span></td></tr>`).join('');
}

function openProductModal(id){
  editingId=id||null;
  const t=T[lang];
  document.getElementById('modalTitle').textContent=id?t.modalEdit:t.modalAdd;
  document.getElementById('lName').textContent=t.lName;
  document.getElementById('lNameEn').textContent=t.lNameEn;
  document.getElementById('lCat').textContent=t.lCat;
  document.getElementById('lEmoji').textContent=t.lEmoji;
  document.getElementById('lPrice').textContent=t.lPrice;
  document.getElementById('lOrig').textContent=t.lOrig;
  document.getElementById('lUnit').textContent=t.lUnit;
  document.getElementById('lStock').textContent=t.lStock;
  document.getElementById('cancelBtn').textContent=t.cancelBtn;
  document.getElementById('saveBtn').textContent=t.saveBtn;
  if(id){
    const p=products.find(x=>x.id===id);
    document.getElementById('pName').value=p.nameZh;
    document.getElementById('pNameEn').value=p.nameEn;
    document.getElementById('pCat').value=p.cat;
    document.getElementById('pEmoji').value=p.emoji;
    document.getElementById('pPrice').value=p.price;
    document.getElementById('pOrig').value=p.orig||'';
    document.getElementById('pUnit').value=lang==='zh'?p.unitZh:p.unitEn;
    document.getElementById('pStock').value=p.stock;
  } else {
    ['pName','pNameEn','pEmoji','pPrice','pOrig','pUnit','pStock'].forEach(i=>document.getElementById(i).value='');
  }
  document.getElementById('productModal').classList.add('open');
}
function editProduct(id){openProductModal(id);}
function closeProductModal(){document.getElementById('productModal').classList.remove('open');}

function saveProduct(){
  const t=T[lang];
  const nameZh=document.getElementById('pName').value.trim();
  const price=parseFloat(document.getElementById('pPrice').value);
  if(!nameZh||!price){showToast(t.fillReq);return;}
  const data={
    nameZh, nameEn:document.getElementById('pNameEn').value.trim()||nameZh,
    cat:document.getElementById('pCat').value,
    emoji:document.getElementById('pEmoji').value||'📦',
    price, orig:parseFloat(document.getElementById('pOrig').value)||null,
    unitZh:document.getElementById('pUnit').value, unitEn:document.getElementById('pUnit').value,
    stock:parseInt(document.getElementById('pStock').value)||0, active:true,
  };
  if(editingId){Object.assign(products.find(p=>p.id===editingId),data);showToast(t.updatedToast);}
  else{data.id=Date.now();products.push(data);showToast(t.savedToast);}
  closeProductModal(); renderProducts();
}

function toggleProduct(id){
  const t=T[lang]; const p=products.find(x=>x.id===id);
  p.active=!p.active;
  showToast(`${lang==='zh'?p.nameZh:p.nameEn} — ${p.active?t.toggleOn:t.toggleOff}`);
  renderProducts();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function updateTime(){document.getElementById('nowTime').textContent=new Date().toLocaleString(lang==='zh'?'zh-CN':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
setInterval(updateTime,1000); updateTime();

applyLang();
</script>
</body>
</html>
