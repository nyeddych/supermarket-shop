<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲜惠超市 — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#2d6a4f;--green-pale:#d8f3dc;--orange:#e76f51;--dark:#1b1b1b;--gray:#6b7280;--gray-light:#f3f4f6;--white:#fff;--sw:220px;--shadow:0 2px 12px rgba(0,0,0,.08);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans SC',sans-serif;background:#f7f9f4;color:var(--dark);display:flex;min-height:100vh;}
  .sidebar{width:var(--sw);background:var(--green);color:#fff;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:10;}
  .s-logo{padding:20px;font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15);}
  .s-logo span{color:#a7f3d0;}
  .s-nav{padding:12px 0;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:14px;font-weight:500;color:rgba(255,255,255,.75);transition:all .2s;border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:#a7f3d0;}
  .lang-row{display:flex;gap:2px;background:rgba(255,255,255,.15);border-radius:50px;padding:3px;margin:0 16px 12px;}
  .lb{flex:1;border:none;background:transparent;border-radius:50px;padding:5px 0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:rgba(255,255,255,.7);transition:all .2s;text-align:center;}
  .lb.active{background:rgba(255,255,255,.9);color:var(--green);}
  .s-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:rgba(255,255,255,.5);}
  .main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;}
  .topbar{background:var(--white);border-bottom:1px solid #e5e7eb;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:var(--shadow);}
  .topbar-title{font-size:17px;font-weight:700;}
  .content{padding:24px 28px;flex:1;}
  .page{display:none;}.page.active{display:block;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--white);border-radius:12px;padding:18px;box-shadow:var(--shadow);}
  .stat-label{font-size:13px;color:var(--gray);margin-bottom:6px;}
  .stat-value{font-size:26px;font-weight:700;margin-bottom:4px;}
  .stat-sub{font-size:12px;color:var(--green);}
  .stat-sub.warn{color:var(--orange);}
  .card{background:var(--white);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;}
  .card-header{padding:14px 18px;border-bottom:1px solid var(--gray-light);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:15px;font-weight:700;}
  .btn{border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:all .2s;}
  .btn-primary{background:var(--green);color:#fff;}.btn-primary:hover{background:#40916c;}
  .btn-danger{background:#fee2e2;color:#dc2626;}.btn-danger:hover{background:#dc2626;color:#fff;}
  .btn-sm{padding:4px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;}
  th{background:var(--gray-light);padding:11px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--gray);}
  td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--gray-light);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fafff8;}
  .pill{border-radius:50px;padding:3px 10px;font-size:12px;font-weight:500;}
  .p-pending{background:#fef3c7;color:#92400e;}
  .p-shipping{background:#dbeafe;color:#1e40af;}
  .p-done{background:var(--green-pale);color:var(--green);}
  .p-ok{background:var(--green-pale);color:var(--green);}
  .p-off{background:var(--gray-light);color:var(--gray);}
  .low{color:var(--orange);font-weight:600;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--white);border-radius:14px;width:min(460px,90vw);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:18px;}
  .frow{margin-bottom:14px;}
  .frow label{display:block;font-size:12px;font-weight:500;color:var(--gray);margin-bottom:5px;}
  .frow input,.frow select{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;}
  .frow input:focus,.frow select:focus{border-color:var(--green);}
  .frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;z-index:200;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;}
  .toast.show{transform:translateY(0);opacity:1;}
  .empty-row td{text-align:center;color:var(--gray);padding:24px;}
  @media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr);}.sidebar{transform:translateX(-100%);}.main{margin-left:0;}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="s-logo">鲜<span>惠</span> <span style="font-size:12px;font-weight:400;opacity:.6" id="sideLabel">后台</span></div>
  <nav class="s-nav" id="sideNav"></nav>
  <div class="lang-row">
    <button class="lb active" id="lbZH" onclick="setLang('zh')">中文</button>
    <button class="lb" id="lbEN" onclick="setLang('en')">EN</button>
  </div>
  <div class="s-foot" id="sideFooter"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle"></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:12px;color:var(--gray)" id="nowTime"></span>
      <span style="background:var(--green-pale);color:var(--green);border-radius:50px;padding:5px 12px;font-size:13px;font-weight:500" id="adminBadge">👤 管理员</span>
      <a href="index.html" style="text-decoration:none"><button class="btn btn-primary" id="frontBtn">查看前台 →</button></a>
    </div>
  </div>
  <div class="content">
    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label" id="s1l"></div><div class="stat-value" style="color:var(--green)" id="s1v">—</div><div class="stat-sub" id="s1s"></div></div>
        <div class="stat-card"><div class="stat-label" id="s2l"></div><div class="stat-value" style="color:var(--orange)" id="s2v">—</div><div class="stat-sub" id="s2s"></div></div>
        <div class="stat-card"><div class="stat-label" id="s3l"></div><div class="stat-value" id="s3v">—</div><div class="stat-sub warn" id="s3s"></div></div>
        <div class="stat-card"><div class="stat-label" id="s4l"></div><div class="stat-value" style="color:#f59e0b" id="s4v">—</div><div class="stat-sub warn" id="s4s"></div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title" id="recentTitle"></div></div>
        <table><thead><tr id="dashTH"></tr></thead><tbody id="dashTB"></tbody></table>
      </div>
    </div>
    <!-- PRODUCTS -->
    <div class="page" id="page-products">
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="prodTitle"></div>
          <button class="btn btn-primary" id="addBtn" onclick="openModal()"></button>
        </div>
        <table><thead><tr id="prodTH"></tr></thead><tbody id="prodTB"></tbody></table>
      </div>
    </div>
    <!-- ORDERS -->
    <div class="page" id="page-orders">
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="ordTitle"></div>
          <select class="btn" style="border:1.5px solid #e5e7eb" id="ordFilter" onchange="renderOrders()"></select>
        </div>
        <table><thead><tr id="ordTH"></tr></thead><tbody id="ordTB"></tbody></table>
      </div>
    </div>
    <!-- INVENTORY -->
    <div class="page" id="page-inventory">
      <div class="card">
        <div class="card-header"><div class="card-title" id="invWarnTitle"></div></div>
        <table><thead><tr id="invWarnTH"></tr></thead><tbody id="invWarnTB"></tbody></table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title" id="invOkTitle"></div></div>
        <table><thead><tr id="invOkTH"></tr></thead><tbody id="invOkTB"></tbody></table>
      </div>
    </div>
  </div>
</main>

<!-- Product Modal -->
<div class="modal-bg" id="prodModal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="frow"><label id="ml1"></label><input type="text" id="pNameZh"></div>
    <div class="frow"><label id="ml2"></label><input type="text" id="pNameEn"></div>
    <div class="frow2">
      <div class="frow"><label id="ml3"></label>
        <select id="pCat">
          <option value="生鲜">生鲜 / Fresh</option>
          <option value="肉禽">肉禽 / Meat</option>
          <option value="乳品">乳品 / Dairy</option>
          <option value="零食">零食 / Snacks</option>
          <option value="粮油">粮油 / Grains</option>
          <option value="日用">日用 / Essentials</option>
        </select>
      </div>
      <div class="frow"><label id="ml4"></label><input type="text" id="pEmoji" placeholder="🥦"></div>
    </div>
    <div class="frow2">
      <div class="frow"><label id="ml5"></label><input type="number" id="pPrice" step="0.1"></div>
      <div class="frow"><label id="ml6"></label><input type="number" id="pOrig" step="0.1"></div>
    </div>
    <div class="frow2">
      <div class="frow"><label id="ml7"></label><input type="text" id="pUnitZh"></div>
      <div class="frow"><label id="ml8"></label><input type="text" id="pUnitEn"></div>
    </div>
    <div class="frow"><label id="ml9"></label><input type="number" id="pStock"></div>
    <div class="modal-footer">
      <button class="btn" style="background:var(--gray-light)" onclick="closeModal()" id="mCancel"></button>
      <button class="btn btn-primary" onclick="saveProduct()" id="mSave"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://zzbdfuusbbbupxwlkyth.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6YmRmdXVzYmJidXB4d2xreXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NzcyMzQsImV4cCI6MjA4OTE1MzIzNH0.oHv8KlOuRh1TRKsFY32p2JIWu1Qghq91tigzRxaSMvE';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const api=async(m,path,body)=>{const r=await fetch(SB_URL+'/rest/v1/'+path,{method:m,headers:H,body:body?JSON.stringify(body):undefined});return r.json();};
const GET=(p,q='')=>api('GET',p+(q?'?'+q:''));
const POST=(p,b)=>api('POST',p,b);
const PATCH=(p,q,b)=>api('PATCH',p+'?'+q,b);

const T={
  zh:{side:'后台',foot:'管理员：店长\n最后登录：今天 09:12',badge:'👤 管理员',front:'查看前台 →',
    navs:['📊 数据概览','🛒 商品管理','📦 订单管理','📋 库存预警'],
    pages:{dashboard:'数据概览',products:'商品管理',orders:'订单管理',inventory:'库存预警'},
    s1:'今日订单',s2:'今日营业额',s3:'在架商品',s4:'待处理订单',
    recentTitle:'📈 近期订单',
    dashTH:['订单号','摘要','金额','状态','时间','操作'],
    prodTitle:'🛒 商品列表',addBtn:'+ 新增商品',
    prodTH:['商品','分类','价格','库存','状态','操作'],
    ordTitle:'📦 全部订单',
    ordFilters:['全部状态','待处理','配送中','已完成'],
    ordFilterVals:['ALL','待处理','配送中','已完成'],
    ordTH:['订单号','摘要','金额','地址','状态','操作'],
    invWarnTitle:'⚠ 库存预警（低于20件）',invOkTitle:'✅ 库存正常',
    invWarnTH:['商品','分类','库存','建议补货'],invOkTH:['商品','分类','库存','状态'],
    onShelf:'在售',offShelf:'下架',okStock:'充足',
    edit:'编辑',unlist:'下架',relist:'上架',
    startDel:'开始配送',complete:'完成',done:'✓ 已完成',
    noWarn:'🎉 无库存预警',
    modalAdd:'➕ 新增商品',modalEdit:'✏️ 编辑商品',
    ml:['商品名称（中文）','Product Name (EN)','分类','Emoji','售价 (¥)','原价 (¥，可选)','规格（中文）','Unit (EN)','库存'],
    cancel:'取消',save:'保存',saved:'✅ 已保存',updated:'✅ 已更新',toggled:(n,s)=>`${n} 已${s}`,fill:'请填写名称和价格',
    ordUpdated:(id,s)=>`订单 ${id} → ${s}`,restock:n=>`建议补 ${n} 件`,
  },
  en:{side:'Admin',foot:'Admin: Store Manager\nLast login: Today 09:12',badge:'👤 Admin',front:'View Store →',
    navs:['📊 Dashboard','🛒 Products','📦 Orders','📋 Inventory'],
    pages:{dashboard:'Dashboard',products:'Products',orders:'Orders',inventory:'Inventory'},
    s1:'Orders Today',s2:"Today's Revenue",s3:'Active Products',s4:'Pending Orders',
    recentTitle:'📈 Recent Orders',
    dashTH:['Order #','Summary','Amount','Status','Time','Action'],
    prodTitle:'🛒 Product List',addBtn:'+ Add Product',
    prodTH:['Product','Category','Price','Stock','Status','Actions'],
    ordTitle:'📦 All Orders',
    ordFilters:['All Status','Pending','Shipping','Completed'],
    ordFilterVals:['ALL','待处理','配送中','已完成'],
    ordTH:['Order #','Summary','Amount','Address','Status','Action'],
    invWarnTitle:'⚠ Low Stock Alert (under 20)',invOkTitle:'✅ Stock Normal',
    invWarnTH:['Product','Category','Stock','Suggested Restock'],invOkTH:['Product','Category','Stock','Status'],
    onShelf:'Active',offShelf:'Inactive',okStock:'OK',
    edit:'Edit',unlist:'Unlist',relist:'List',
    startDel:'Start Delivery',complete:'Complete',done:'✓ Done',
    noWarn:'🎉 No stock alerts',
    modalAdd:'➕ Add Product',modalEdit:'✏️ Edit Product',
    ml:['Product Name (Chinese)','Product Name (English)','Category','Emoji','Price (¥)','Orig. Price (¥, opt.)','Unit (Chinese)','Unit (English)','Stock'],
    cancel:'Cancel',save:'Save',saved:'✅ Saved',updated:'✅ Updated',toggled:(n,s)=>`${n} — ${s}`,fill:'Please enter name and price',
    ordUpdated:(id,s)=>`Order ${id} → ${s}`,restock:n=>`Restock ${n} units`,
  }
};

const statusClass=s=>({待处理:'p-pending',配送中:'p-shipping',已完成:'p-done'}[s]||'p-off');
const statusLabel=(s,lang)=>({zh:{待处理:'待处理',配送中:'配送中',已完成:'已完成'},en:{待处理:'Pending',配送中:'Shipping',已完成:'Completed'}}[lang][s]||s);

let lang='zh',currentPage='dashboard',editingId=null;
let products=[],orders=[];

function setLang(l){lang=l;document.getElementById('lbZH').classList.toggle('active',l==='zh');document.getElementById('lbEN').classList.toggle('active',l==='en');applyLang();}

function applyLang(){
  const t=T[lang];
  document.getElementById('sideLabel').textContent=t.side;
  document.getElementById('sideFooter').textContent=t.foot;
  document.getElementById('adminBadge').textContent=t.badge;
  document.getElementById('frontBtn').textContent=t.front;
  document.getElementById('pageTitle').textContent=t.pages[currentPage];
  const pages=['dashboard','products','orders','inventory'];
  document.getElementById('sideNav').innerHTML=pages.map((p,i)=>`<div class="nav-item${currentPage===p?' active':''}" onclick="goPage('${p}',this)">${t.navs[i]}</div>`).join('');
  // stat labels
  ['s1','s2','s3','s4'].forEach(k=>document.getElementById(k+'l').textContent=t[k]);
  document.getElementById('recentTitle').textContent=t.recentTitle;
  document.getElementById('prodTitle').textContent=t.prodTitle;
  document.getElementById('addBtn').textContent=t.addBtn;
  document.getElementById('ordTitle').textContent=t.ordTitle;
  document.getElementById('invWarnTitle').textContent=t.invWarnTitle;
  document.getElementById('invOkTitle').textContent=t.invOkTitle;
  document.getElementById('mCancel').textContent=t.cancel;
  document.getElementById('mSave').textContent=t.save;
  // order filter
  const sel=document.getElementById('ordFilter');
  const cur=sel.value;
  sel.innerHTML=t.ordFilters.map((l,i)=>`<option value="${t.ordFilterVals[i]}">${l}</option>`).join('');
  // modal labels
  t.ml.forEach((l,i)=>{const el=document.getElementById('ml'+(i+1));if(el)el.textContent=l;});
  renderAll();
}

function goPage(name,el){
  currentPage=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(el)el.classList.add('active');
  document.getElementById('pageTitle').textContent=T[lang].pages[name];
  renderAll();
}

function renderAll(){
  renderDash();renderProducts();renderOrders();renderInventory();
}

function renderDash(){
  const t=T[lang];
  const todayOrders=orders.filter(o=>o.status!=='已完成');
  const todayRev=orders.reduce((s,o)=>s+o.total,0);
  const activeProds=products.filter(p=>p.active).length;
  const pending=orders.filter(o=>o.status==='待处理').length;
  const lowCount=products.filter(p=>p.stock<20).length;
  document.getElementById('s1v').textContent=orders.length;
  document.getElementById('s2v').textContent='¥'+todayRev.toFixed(0);
  document.getElementById('s3v').textContent=activeProds;
  document.getElementById('s4v').textContent=pending;
  document.getElementById('s1s').textContent='↑ +12%';
  document.getElementById('s2s').textContent='↑ +8%';
  document.getElementById('s3s').textContent=lowCount>0?`⚠ ${lowCount} ${lang==='zh'?'件库存不足':'low stock'}`:'';
  document.getElementById('s4s').textContent=pending>0?(lang==='zh'?'需尽快处理':'Needs attention'):'';
  document.getElementById('dashTH').innerHTML=t.dashTH.map(h=>`<th>${h}</th>`).join('');
  const recent=orders.slice(0,6);
  document.getElementById('dashTB').innerHTML=recent.length?recent.map(o=>`
    <tr><td style="font-size:11px;color:var(--gray);font-weight:500">#${o.id}</td>
    <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.address?.split('|')[0]||'—'}</td>
    <td style="color:var(--green);font-weight:700">¥${o.total?.toFixed(2)}</td>
    <td><span class="pill ${statusClass(o.status)}">${statusLabel(o.status,lang)}</span></td>
    <td style="color:var(--gray);font-size:12px">${new Date(o.created_at).toLocaleTimeString(lang==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit'})}</td>
    <td>${o.status==='待处理'?`<button class="btn btn-sm btn-primary" onclick="updateOrder(${o.id},'配送中')">${t.startDel}</button>`:''}</td></tr>`).join('')
    :`<tr class="empty-row"><td colspan="6">${lang==='zh'?'暂无订单':'No orders yet'}</td></tr>`;
}

function renderProducts(){
  const t=T[lang];
  document.getElementById('prodTH').innerHTML=t.prodTH.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('prodTB').innerHTML=products.length?products.map(p=>`
    <tr><td>${p.emoji} ${lang==='zh'?p.name_zh:p.name_en}<br><span style="font-size:11px;color:var(--gray)">${lang==='zh'?p.unit_zh:p.unit_en}</span></td>
    <td>${p.category}</td>
    <td>¥${p.price}${p.original_price?`<span style="font-size:11px;color:var(--gray);text-decoration:line-through;margin-left:4px">¥${p.original_price}</span>`:''}</td>
    <td class="${p.stock<20?'low':''}">${p.stock}${p.stock<20?' ⚠':''}</td>
    <td><span class="pill ${p.active?'p-ok':'p-off'}">${p.active?t.onShelf:t.offShelf}</span></td>
    <td style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="btn btn-sm" style="background:var(--gray-light)" onclick="openModal(${p.id})">${t.edit}</button>
      <button class="btn btn-sm btn-danger" onclick="toggleProduct(${p.id})">${p.active?t.unlist:t.relist}</button>
    </td></tr>`).join('')
    :`<tr class="empty-row"><td colspan="6">${lang==='zh'?'暂无商品':'No products'}</td></tr>`;
}

function renderOrders(){
  const t=T[lang];
  document.getElementById('ordTH').innerHTML=t.ordTH.map(h=>`<th>${h}</th>`).join('');
  const filter=document.getElementById('ordFilter').value;
  const list=filter==='ALL'?orders:orders.filter(o=>o.status===filter);
  document.getElementById('ordTB').innerHTML=list.length?list.map(o=>{
    const parts=(o.address||'').split('|');
    return`<tr><td style="font-size:11px;color:var(--gray);font-weight:500">#${o.id}</td>
    <td>${Array.isArray(o.items)?o.items.map(i=>`${i.emoji}×${i.qty}`).join(' '):'—'}</td>
    <td style="color:var(--green);font-weight:700">¥${o.total?.toFixed(2)}</td>
    <td style="font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${parts[0]||''} ${parts[2]||''}</td>
    <td><span class="pill ${statusClass(o.status)}">${statusLabel(o.status,lang)}</span></td>
    <td>${o.status==='待处理'?`<button class="btn btn-sm btn-primary" onclick="updateOrder(${o.id},'配送中')">${t.startDel}</button>`:o.status==='配送中'?`<button class="btn btn-sm btn-primary" onclick="updateOrder(${o.id},'已完成')">${t.complete}</button>`:`<span style="color:var(--gray);font-size:12px">${t.done}</span>`}</td></tr>`;
  }).join(''):`<tr class="empty-row"><td colspan="6">${lang==='zh'?'暂无订单':'No orders'}</td></tr>`;
}

function renderInventory(){
  const t=T[lang];
  document.getElementById('invWarnTH').innerHTML=t.invWarnTH.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('invOkTH').innerHTML=t.invOkTH.map(h=>`<th>${h}</th>`).join('');
  const low=products.filter(p=>p.stock<20);
  const ok=products.filter(p=>p.stock>=20);
  document.getElementById('invWarnTB').innerHTML=low.length?low.map(p=>`
    <tr><td>${p.emoji} ${lang==='zh'?p.name_zh:p.name_en}</td><td>${p.category}</td>
    <td class="low">${p.stock} ⚠</td>
    <td style="color:var(--green);font-weight:500">${t.restock(Math.max(50-p.stock,20))}</td></tr>`).join('')
    :`<tr class="empty-row"><td colspan="4">${t.noWarn}</td></tr>`;
  document.getElementById('invOkTB').innerHTML=ok.map(p=>`
    <tr><td>${p.emoji} ${lang==='zh'?p.name_zh:p.name_en}</td><td>${p.category}</td><td>${p.stock}</td>
    <td><span class="pill p-ok">${t.okStock}</span></td></tr>`).join('');
}

async function updateOrder(id,status){
  await PATCH('orders','id=eq.'+id,{status});
  const o=orders.find(x=>x.id===id);if(o)o.status=status;
  toast(T[lang].ordUpdated(id,statusLabel(status,lang)));renderAll();
}

function openModal(id){
  editingId=id||null;const t=T[lang];
  document.getElementById('modalTitle').textContent=id?t.modalEdit:t.modalAdd;
  if(id){
    const p=products.find(x=>x.id===id);
    document.getElementById('pNameZh').value=p.name_zh;
    document.getElementById('pNameEn').value=p.name_en;
    document.getElementById('pCat').value=p.category;
    document.getElementById('pEmoji').value=p.emoji;
    document.getElementById('pPrice').value=p.price;
    document.getElementById('pOrig').value=p.original_price||'';
    document.getElementById('pUnitZh').value=p.unit_zh;
    document.getElementById('pUnitEn').value=p.unit_en;
    document.getElementById('pStock').value=p.stock;
  } else {
    ['pNameZh','pNameEn','pEmoji','pPrice','pOrig','pUnitZh','pUnitEn','pStock'].forEach(i=>document.getElementById(i).value='');
  }
  document.getElementById('prodModal').classList.add('open');
}
function closeModal(){document.getElementById('prodModal').classList.remove('open');}

async function saveProduct(){
  const t=T[lang];
  const name_zh=document.getElementById('pNameZh').value.trim();
  const price=parseFloat(document.getElementById('pPrice').value);
  if(!name_zh||!price){toast(t.fill);return;}
  const data={name_zh,name_en:document.getElementById('pNameEn').value.trim()||name_zh,category:document.getElementById('pCat').value,emoji:document.getElementById('pEmoji').value||'📦',price,original_price:parseFloat(document.getElementById('pOrig').value)||null,unit_zh:document.getElementById('pUnitZh').value,unit_en:document.getElementById('pUnitEn').value,stock:parseInt(document.getElementById('pStock').value)||0,active:true};
  if(editingId){
    await PATCH('products','id=eq.'+editingId,data);
    const idx=products.findIndex(p=>p.id===editingId);if(idx>=0)products[idx]={...products[idx],...data};
    toast(t.updated);
  } else {
    const res=await POST('products',data);
    if(Array.isArray(res)&&res[0])products.push(res[0]);
    toast(t.saved);
  }
  closeModal();renderAll();
}

async function toggleProduct(id){
  const t=T[lang];const p=products.find(x=>x.id===id);
  p.active=!p.active;
  await PATCH('products','id=eq.'+id,{active:p.active});
  toast(t.toggled(lang==='zh'?p.name_zh:p.name_en,p.active?t.onShelf:t.offShelf));
  renderAll();
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

function tick(){document.getElementById('nowTime').textContent=new Date().toLocaleString(lang==='zh'?'zh-CN':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();

async function init(){
  const [p,o]=await Promise.all([GET('products','select=*&order=id'),GET('orders','select=*&order=created_at.desc')]);
  if(Array.isArray(p))products=p;
  if(Array.isArray(o))orders=o;
  applyLang();
}
init();
</script>
</body>
</html>
