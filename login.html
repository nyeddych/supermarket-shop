<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / Login — 鲜惠超市</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#2d6a4f;--green-mid:#40916c;--green-pale:#d8f3dc;--orange:#e76f51;--dark:#1b1b1b;--gray:#6b7280;--gray-light:#f3f4f6;--white:#fff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,var(--green) 0%,var(--green-mid) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--white);border-radius:24px;width:min(440px,100%);padding:40px;box-shadow:0 24px 60px rgba(0,0,0,.2);}
  .logo{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--green);text-align:center;margin-bottom:6px;}
  .logo span{color:var(--orange);}
  .subtitle{text-align:center;font-size:14px;color:var(--gray);margin-bottom:32px;}
  .tabs{display:flex;background:var(--gray-light);border-radius:50px;padding:4px;margin-bottom:28px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;color:var(--gray);transition:all .2s;border:none;background:transparent;font-family:inherit;}
  .tab.active{background:var(--white);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .form{display:none;}
  .form.active{display:block;}
  .frow{margin-bottom:16px;}
  .frow label{display:block;font-size:13px;font-weight:500;color:var(--gray);margin-bottom:6px;}
  .frow input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 16px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
  .frow input:focus{border-color:var(--green);}
  .btn-submit{width:100%;background:var(--green);color:#fff;border:none;border-radius:50px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;margin-top:8px;}
  .btn-submit:hover{background:var(--orange);}
  .btn-submit:disabled{background:var(--gray);cursor:not-allowed;}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--gray);font-size:13px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb;}
  .btn-google{width:100%;background:var(--white);color:var(--dark);border:1.5px solid #e5e7eb;border-radius:50px;padding:12px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;}
  .btn-google:hover{border-color:var(--green);background:var(--green-pale);}
  .msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;}
  .msg.error{background:#fee2e2;color:#dc2626;display:block;}
  .msg.success{background:var(--green-pale);color:var(--green);display:block;}
  .lang-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
  .lb{border:none;background:transparent;font-size:13px;color:var(--gray);cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px;}
  .lb.active{color:var(--green);font-weight:600;background:var(--green-pale);}
  .forget{text-align:right;font-size:12px;margin-top:-8px;margin-bottom:16px;}
  .forget a{color:var(--green);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">鲜<span>惠</span>超市</div>
  <div class="subtitle" id="cardSub">新鲜每一天 · Fresh Every Day</div>
  <div class="lang-row">
    <button class="lb active" id="lbZH" onclick="setLang('zh')">中文</button>
    <button class="lb" id="lbEN" onclick="setLang('en')">EN</button>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
    <button class="tab" id="tabReg" onclick="switchTab('register')">注册</button>
  </div>

  <!-- LOGIN FORM -->
  <div class="form active" id="formLogin">
    <div class="msg" id="loginMsg"></div>
    <div class="frow"><label id="lEmail1">邮箱</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
    <div class="frow"><label id="lPwd1">密码</label><input type="password" id="loginPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="forget"><a href="reset.html" id="lForget">忘记密码？</a></div>
    <button class="btn-submit" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="divider" id="orText">或</div>
    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.96 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span id="googleLabel">使用 Google 登录</span>
    </button>
  </div>

  <!-- REGISTER FORM -->
  <div class="form" id="formRegister">
    <div class="msg" id="regMsg"></div>
    <div class="frow"><label id="lName">姓名</label><input type="text" id="regName" placeholder="请输入姓名"></div>
    <div class="frow"><label id="lEmail2">邮箱</label><input type="email" id="regEmail" placeholder="your@email.com"></div>
    <div class="frow"><label id="lPwd2">密码</label><input type="password" id="regPwd" placeholder="至少6位" onkeydown="if(event.key==='Enter')doRegister()"></div>
    <div class="frow"><label id="lPwd3">确认密码</label><input type="password" id="regPwd2" placeholder="再输一次" onkeydown="if(event.key==='Enter')doRegister()"></div>
    <button class="btn-submit" id="regBtn" onclick="doRegister()">注册</button>
  </div>
</div>

<script>
const SB_URL='https://zzbdfuusbbbupxwlkyth.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6YmRmdXVzYmJidXB4d2xreXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NzcyMzQsImV4cCI6MjA4OTE1MzIzNH0.oHv8KlOuRh1TRKsFY32p2JIWu1Qghq91tigzRxaSMvE';
const AH={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

const T={
  zh:{sub:'新鲜每一天 · Fresh Every Day',tabLogin:'登录',tabReg:'注册',lEmail:'邮箱',lPwd:'密码',lForget:'忘记密码？',loginBtn:'登录',or:'或',google:'使用 Google 登录',lName:'姓名',lEmail2:'邮箱',lPwd2:'密码（至少6位）',lPwd3:'确认密码',regBtn:'注册账号',loginOk:'登录成功，跳转中…',regOk:'注册成功！请查收验证邮件，然后登录。',pwdMismatch:'两次密码不一致',fillAll:'请填写所有字段',loginFail:'邮箱或密码错误',regFail:'注册失败，请重试'},
  en:{sub:'Fresh Every Day · 新鲜每一天',tabLogin:'Login',tabReg:'Register',lEmail:'Email',lPwd:'Password',lForget:'Forgot password?',loginBtn:'Login',or:'or',google:'Continue with Google',lName:'Full Name',lEmail2:'Email',lPwd2:'Password (min 6 chars)',lPwd3:'Confirm Password',regBtn:'Create Account',loginOk:'Login successful, redirecting…',regOk:'Account created! Check your email to verify, then login.',pwdMismatch:'Passwords do not match',fillAll:'Please fill in all fields',loginFail:'Invalid email or password',regFail:'Registration failed, please retry'},
};
let lang='zh';

function setLang(l){
  lang=l;
  document.getElementById('lbZH').classList.toggle('active',l==='zh');
  document.getElementById('lbEN').classList.toggle('active',l==='en');
  const t=T[l];
  document.getElementById('cardSub').textContent=t.sub;
  document.getElementById('tabLogin').textContent=t.tabLogin;
  document.getElementById('tabReg').textContent=t.tabReg;
  document.getElementById('lEmail1').textContent=t.lEmail;
  document.getElementById('lPwd1').textContent=t.lPwd;
  document.getElementById('lForget').textContent=t.lForget;
  document.getElementById('loginBtn').textContent=t.loginBtn;
  document.getElementById('orText').textContent=t.or;
  document.getElementById('googleLabel').textContent=t.google;
  document.getElementById('lName').textContent=t.lName;
  document.getElementById('lEmail2').textContent=t.lEmail2;
  document.getElementById('lPwd2').textContent=t.lPwd2;
  document.getElementById('lPwd3').textContent=t.lPwd3;
  document.getElementById('regBtn').textContent=t.regBtn;
}

function switchTab(tab){
  document.getElementById('formLogin').classList.toggle('active',tab==='login');
  document.getElementById('formRegister').classList.toggle('active',tab==='register');
  document.getElementById('tabLogin').classList.toggle('active',tab==='login');
  document.getElementById('tabReg').classList.toggle('active',tab==='register');
}

function showMsg(id,type,msg){const el=document.getElementById(id);el.className='msg '+type;el.textContent=msg;}

async function doLogin(){
  const t=T[lang];
  const email=document.getElementById('loginEmail').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  if(!email||!pwd){showMsg('loginMsg','error',t.fillAll);return;}
  document.getElementById('loginBtn').disabled=true;
  try{
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:AH,body:JSON.stringify({email,password:pwd})});
    const d=await r.json();
    if(d.access_token){
      localStorage.setItem('sb_token',d.access_token);
      localStorage.setItem('sb_refresh',d.refresh_token);
      localStorage.setItem('sb_user',JSON.stringify(d.user));
      showMsg('loginMsg','success',t.loginOk);
      setTimeout(()=>{
        const role=d.user?.user_metadata?.role;
        window.location.href='index.html';
      },800);
    } else {
      showMsg('loginMsg','error',t.loginFail);
    }
  }catch(e){showMsg('loginMsg','error',t.loginFail);}
  document.getElementById('loginBtn').disabled=false;
}

async function doRegister(){
  const t=T[lang];
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pwd=document.getElementById('regPwd').value;
  const pwd2=document.getElementById('regPwd2').value;
  if(!name||!email||!pwd){showMsg('regMsg','error',t.fillAll);return;}
  if(pwd!==pwd2){showMsg('regMsg','error',t.pwdMismatch);return;}
  document.getElementById('regBtn').disabled=true;
  try{
    const r=await fetch(`${SB_URL}/auth/v1/signup`,{method:'POST',headers:AH,body:JSON.stringify({email,password:pwd,data:{name}})});
    const d=await r.json();
    if(d.user||d.id){
      showMsg('regMsg','success',t.regOk);
      setTimeout(()=>switchTab('login'),2000);
    } else {
      showMsg('regMsg','error',d.msg||t.regFail);
    }
  }catch(e){showMsg('regMsg','error',t.regFail);}
  document.getElementById('regBtn').disabled=false;
}

async function loginGoogle(){
  const r=await fetch(`${SB_URL}/auth/v1/authorize?provider=google`,{headers:AH});
  window.location.href=`${SB_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(window.location.origin+'/index.html')}`;
}

// 已登录则直接跳转
const token=localStorage.getItem('sb_token');
if(token) window.location.href='index.html';
</script>
</body>
</html>
